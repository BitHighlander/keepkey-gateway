services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pioneer
      POSTGRES_USER: pioneer
      POSTGRES_PASSWORD: pioneer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pioneer -d pioneer"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pioneer-postgres:/var/lib/postgresql/data

  gateway:
    build: ./container
    environment:
      DATABASE_URL: postgres://pioneer:pioneer@postgres:5432/pioneer
      DATABASE_MAX_CONNECTIONS: 5
      PORT: 12000
      ZERION_API_KEY: ${ZERION_API_KEY:-}
      NOWNODES_API_KEY: ${NOWNODES_API_KEY:-}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
    ports:
      - "12000:12000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pioneer-postgres:
