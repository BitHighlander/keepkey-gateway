# Every push to master is tested, built and deployed to oracles.cc.
# CI owns the container image and the rollout; no local Docker needed.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: make test
      - run: make typecheck
      - run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53185d258559a5dae7d6fa6225cc46ba
      - name: Live health
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://oracles.cc/api/v1/health
