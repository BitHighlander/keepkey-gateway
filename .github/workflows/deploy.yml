# Every push to master is tested, built and deployed to oracles.cc.
# CI owns the container image and the rollout; no local Docker needed.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      realtime-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gateway_realtime_test
          POSTGRES_PASSWORD: gateway_realtime_test
          POSTGRES_DB: gateway_realtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway_realtime_test -d gateway_realtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Create isolated budget test database
        run: bun -e 'const { SQL } = await import("bun"); const sql = new SQL("postgres://gateway_realtime_test:gateway_realtime_test@127.0.0.1:5432/gateway_realtime_test"); await sql.unsafe("CREATE DATABASE gateway_budget_test"); await sql.close();'
      - run: make test
        env:
          REALTIME_TEST_DATABASE_URL: postgres://gateway_realtime_test:gateway_realtime_test@127.0.0.1:5432/gateway_realtime_test
          CACHE_TEST_DATABASE_URL: postgres://gateway_realtime_test:gateway_realtime_test@127.0.0.1:5432/gateway_realtime_test
          BUDGET_TEST_DATABASE_URL: postgres://gateway_realtime_test:gateway_realtime_test@127.0.0.1:5432/gateway_budget_test
      - run: make typecheck
      - name: Stamp container revision
        run: |
          bun -e 'await Bun.write("container/data/build-info.json", JSON.stringify({ revision: process.env.GITHUB_SHA }))'
      - run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 53185d258559a5dae7d6fa6225cc46ba
      - name: Live health
        run: bun container/live/deploy-health.ts https://oracles.cc "$GITHUB_SHA"
      - name: Live provider parity
        run: bun container/live/provider-parity.ts https://oracles.cc
      - name: Live Litecoin script discovery
        run: bun container/live/ltc-script-discovery.ts https://oracles.cc
      - name: Verify blue gateway alias
        run: |
          bun container/live/deploy-health.ts https://api-blue.keepkey.info "$GITHUB_SHA"
          bun -e 'const r = await fetch("https://api-blue.keepkey.info/spec/swagger.json", { signal: AbortSignal.timeout(30000) }); if (!r.ok || (await r.json()).servers?.[0]?.url !== "https://api-blue.keepkey.info/api/v1") throw new Error("Blue OpenAPI origin mismatch")'
          bun container/live/ltc-script-discovery.ts https://api-blue.keepkey.info
